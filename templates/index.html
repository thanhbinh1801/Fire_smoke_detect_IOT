<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>He Thong Phat Hien Chay - IoT Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d0f14;--border:rgba(255,255,255,0.08);--danger:#ef4444;--safe:#22c55e;--text-1:#f1f5f9;--text-2:#94a3b8;--text-3:#475569}
    html,body{height:100%;background:var(--bg);color:var(--text-1);font-family:Inter,sans-serif;overflow:hidden}
    .header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(21,24,33,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:60px}
    .logo{width:34px;height:34px;background:linear-gradient(135deg,#f97316,#ef4444);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 14px rgba(249,115,22,0.5);flex-shrink:0}
    .header-title{font-size:15px;font-weight:700}
    .header-sub{font-size:11px;color:var(--text-3)}
    .header-right{margin-left:auto;display:flex;align-items:center;gap:16px}
    .status-pill{display:flex;align-items:center;gap:7px;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent;transition:all 0.3s}
    .status-pill.safe{background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:var(--safe)}
    .status-pill.danger{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.5);color:var(--danger);animation:pill-pulse 1s ease-in-out infinite}
    @keyframes pill-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 10px 3px rgba(239,68,68,0.3)}}
    .pill-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .safe .pill-dot{animation:blink-safe 2s ease-in-out infinite}
    .danger .pill-dot{animation:blink-fast 0.6s step-end infinite}
    @keyframes blink-safe{50%{opacity:0.3}}
    @keyframes blink-fast{50%{opacity:0}}
    .clock{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-3)}
    .stream-container{position:fixed;top:60px;left:0;right:0;bottom:0;background:#000;display:flex;align-items:center;justify-content:center}
    #camera-stream{max-width:100%;max-height:100%;object-fit:contain;display:block}
    .live-badge{position:absolute;top:14px;left:14px;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:0.05em}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:blink-fast 1s step-end infinite}
    .fps-badge{position:absolute;bottom:14px;right:14px;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:4px 10px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-2)}
    .fire-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,rgba(239,68,68,0.96),rgba(185,28,28,0.96));border:1px solid rgba(255,100,100,0.5);border-radius:12px;padding:10px 24px;font-size:15px;font-weight:700;letter-spacing:0.03em;display:flex;align-items:center;gap:10px;box-shadow:0 4px 28px rgba(239,68,68,0.55);opacity:0;pointer-events:none;transition:opacity 0.3s;white-space:nowrap}
    .fire-banner.show{opacity:1}
    .fire-banner.flash{animation:banner-flash 0.7s ease-in-out infinite}
    @keyframes banner-flash{0%,100%{opacity:1}50%{opacity:0.45}}
    #flash-overlay{position:fixed;inset:0;background:rgba(239,68,68,0.1);pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
    #flash-overlay.on{opacity:1}
    #toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#7f1d1d,#450a0a);border:1px solid rgba(239,68,68,0.5);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 20px rgba(239,68,68,0.25);transform:translateX(130%);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);z-index:200}
    #toast.show{transform:translateX(0)}
    .toast-icon{font-size:26px;flex-shrink:0}
    .toast-title{font-size:14px;font-weight:700;color:#fca5a5;line-height:1.3}
    .toast-sub{font-size:11px;color:rgba(252,165,165,0.65);margin-top:3px}
  </style>
</head>
<body>
<div id="flash-overlay"></div>
<div id="toast">
  <div class="toast-icon">&#128293;</div>
  <div>
    <div class="toast-title" id="toast-title">Ph&#7845;t hi&#7879;n l&#7917;a!</div>
    <div class="toast-sub"  id="toast-sub">H&#7879; th&#7889;ng &#273;ang c&#7843;nh b&#225;o...</div>
  </div>
</div>
<header class="header">
  <div class="logo">&#128293;</div>
  <div>
    <div class="header-title">H&#7879; Th&#7889;ng Ph&#225;t Hi&#7879;n Ch&#225;y</div>
    <div class="header-sub">IoT &middot; Raspberry Pi 4 &middot; Camera AI</div>
  </div>
  <div class="header-right">
    <div class="status-pill safe" id="status-pill">
      <div class="pill-dot"></div>
      <span id="pill-text">An to&#224;n</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>
<div class="stream-container">
  <img id="camera-stream" src="/stream" alt="Camera"/>
  <div class="live-badge"><div class="live-dot"></div>TR&#7�;C TI&#7870;P</div>
  <div class="fire-banner" id="fire-banner">&#128293; C&#7842;NH B&#193;O: PH&#7844;T HI&#7878;N L&#7916;A / KH&#211;I!</div>
  <div class="fps-badge" id="fps-badge">-- FPS</div>
</div>
<script>
  var clockEl=document.getElementById('clock');
  setInterval(function(){clockEl.textContent=new Date().toLocaleTimeString('vi-VN',{hour12:false});},1000);
  var statusPill=document.getElementById('status-pill');
  var pillText=document.getElementById('pill-text');
  var fpsBadge=document.getElementById('fps-badge');
  var fireBanner=document.getElementById('fire-banner');
  var flashOv=document.getElementById('flash-overlay');
  function pollStatus(){
    fetch('/api/status').then(function(r){return r.json();}).then(function(data){
      var isFire=data.is_fire;
      var conf=((data.confidence||0)*100).toFixed(0);
      fpsBadge.textContent='Cam '+(data.cam_fps||0).toFixed(1)+' FPS  |  AI '+(data.ai_fps||0).toFixed(1)+' FPS';
      if(isFire){
        statusPill.className='status-pill danger';
        pillText.textContent='Ph\u00e1t hi\u1ec7n ch\u00e1y ('+conf+'%)';
        fireBanner.classList.add('show','flash');
        flashOv.classList.add('on');
      } else {
        statusPill.className='status-pill safe';
        pillText.textContent='An to\u00e0n';
        fireBanner.classList.remove('show','flash');
        flashOv.classList.remove('on');
      }
    }).catch(function(){});
  }
  setInterval(pollStatus,1000); pollStatus();
  var toast=document.getElementById('toast');
  var toastTitle=document.getElementById('toast-title');
  var toastSub=document.getElementById('toast-sub');
  var toastTimer=null;
  function showToast(title,sub){
    toastTitle.textContent=title; toastSub.textContent=sub;
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove('show');},6000);
  }
  function connectSSE(){
    var es=new EventSource('/events');
    es.onmessage=function(e){
      try{
        var data=JSON.parse(e.data);
        if(data.is_fire){
          var label=data.label==='fire'?'l\u1eeda':'kh\u00f3i';
          var conf=((data.confidence||0)*100).toFixed(0);
          showToast('\uD83D\uDD25 Ph\u00e1t hi\u1ec7n '+label+'!','\u0110\u1ed9 ch\u00ednh x\u00e1c: '+conf+'% \u00b7 L\u00fac '+data.time_str);
        }
      }catch(e){}
    };
    es.onerror=function(){es.close();setTimeout(connectSSE,3000);};
  }
  connectSSE();
</script>
</body>
</html>
